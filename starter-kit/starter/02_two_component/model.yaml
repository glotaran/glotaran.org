# The model: what we think is physically happening.
#
# Two states that decay one into the next: s1 -> s2 -> ground.
# An instrument response function (irf) accounts for the finite time
# resolution of the measurement.

initial_concentration:
  input:
    compartments: [s1, s2]
    parameters: [input.1, input.0]

k_matrix:
  k1:
    matrix:
      (s2, s1): kinetic.1
      (s2, s2): kinetic.2

megacomplex:
  m1:
    type: decay
    k_matrix: [k1]

irf:
  irf1:
    type: gaussian
    center: irf.center
    width: irf.width

dataset:
  dataset1:
    initial_concentration: input
    megacomplex: [m1]
    irf: irf1
